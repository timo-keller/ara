[project]
name = "ara"
version = "0.1.0"
description = "Asset Reservation & Allocation API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
ara = "ara.main:run"

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.14"
